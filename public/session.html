<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n-title="page.detail">TokenTracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@300;400;500;600;700&family=Fira+Code:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand"><span class="brand-mark" aria-hidden="true"></span><div><h1>TokenTracker</h1><p data-i18n="brand.tagline">多平台 AI 编码用量分析</p></div></div>
      <div class="topbar-actions">
        <button id="langSwitch" class="lang-switch" type="button" aria-label="切换语言"></button>
        <div class="connection" aria-live="polite"><span id="connectionDot" class="connection-dot"></span><span id="connectionText" data-i18n="status.connecting">正在连接</span></div>
      </div>
    </header>
    <nav id="navRoot"></nav>

    <main>
      <div id="statusBanner" class="status-banner" role="status" hidden></div>
      <section class="panel detail-page">
        <div class="panel-header detail-header">
          <div><h2 data-i18n="detail.title">会话详情</h2><p id="sessionDetailSubtitle">--</p></div>
          <a class="button secondary" href="sessions.html" data-i18n="detail.back">← 返回会话列表</a>
        </div>
        <div id="sessionDetailContent" class="detail-content"><p class="loading-text" data-i18n="detail.loading">正在加载</p></div>
      </section>
    </main>

    <script src="/i18n.js"></script>
    <script src="/common.js"></script>
    <script src="/session.js"></script>
  </body>
</html>
